<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white border-0">
                        <h4 class="mb-0">Forgot Password</h4>
                    </div>
                    <div class="card-body">
                        <p class="text-muted mb-4">Enter your username or email to generate a reset link.</p>
                        <form method="post" action="/forgot-password">
                            <div class="mb-3">
                                <label class="form-label" for="identifier">Username or Email</label>
                                <input type="text" class="form-control" id="identifier" name="identifier" required>
                            </div>
                            <button class="btn btn-primary w-100" type="submit">Generate Reset Link</button>
                        </form>

                        {% if reset_link %}
                            <div class="alert alert-info mt-4">
                                <div class="fw-semibold mb-2">Reset Link (demo mode):</div>
                                <a href="{{ reset_link }}">{{ reset_link }}</a>
                                <div class="small text-muted mt-2">This link expires in 1 hour.</div>
                            </div>
                        {% endif %}
                    </div>
                    <div class="card-footer bg-white border-0 text-center">
                        <a href="/login">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
